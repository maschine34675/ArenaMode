      <stop offset="0.60" stop-color="#ffffff" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
  </defs>
  <path fill="url(#fade)" d="M 0,0 L 688,0 650,107 0,107 Z"/>
  <path fill="#ffffff" opacity="0.30" d="M 0,0 L 514,0 510,2 0,2 Z"/>
